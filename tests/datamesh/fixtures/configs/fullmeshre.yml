naming:
  path_regexp: ".*/shared/monorepo/orgs/(?P<org>[^/]+)/domains/(?P<domain>[^/]+)/projects/(?P<project>[^/]+)/(?P<activity>[^/]+)/(?P<flowtype>[^/]+)/(?P<flow>[^/]+)"
  job:
    prod: "{org}_{domain}_{project}_{flow}_{target}"
    other: "{org}_{domain}_{project}_{flow}_{target}_{username}_{gitbranch}_{gitshortref}"
  pipeline:
    prod: "{org}_{domain}_{project}_{target}_dlt"
    other: "{org}_{domain}_{project}_{target}_{username}_{gitbranch}_{gitshortref}_dlt"
  catalog:
    prod: "{org}_{domain}_{project}_{target}"
    other: "{org}_{domain}_{project}_{target}"
  db:
    prod: "{db}"
    other: "{target}_{username}_{gitbranch}_{gitshortref}_{activity}_{flowtype}_{flow}_{db}"
